name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../chromium-bridge-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz chromium-bridge

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "chromium-bridge-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip"
          Compress-Archive -LiteralPath "target/${{ matrix.target }}/release/chromium-bridge.exe" -DestinationPath $archive

      - name: Smoke test Windows package
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'chromium-bridge-install'
          ./install.ps1 `
            -Version $env:GITHUB_REF_NAME `
            -ArchivePath "chromium-bridge-$env:GITHUB_REF_NAME-${{ matrix.target }}.zip" `
            -InstallDir $installDir `
            -NoPathUpdate
          & (Join-Path $installDir 'chromium-bridge.exe') help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-bridge-${{ matrix.target }}
          path: |
            chromium-bridge-*.tar.gz
            chromium-bridge-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chromium-bridge-*.tar.gz
            chromium-bridge-*.zip
          generate_release_notes: true
